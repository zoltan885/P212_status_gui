version: "3.8"

services:
  nats:
    image: nats:2.10.4
    container_name: nats
    ports:
      - "4222:4222"   # NATS client connections
      - "8222:8222"   # monitoring/metrics
    command: >
      -js
      -m 8222
      --prometheus

  sensor-exporter:
    build: ./sensor_exporter
    container_name: sensor_exporter
    depends_on:
      - nats
    ports:
      - "8000:8000"   # Prometheus scrape endpoint
    environment:
      - NATS_URL=nats://nats:4222

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
